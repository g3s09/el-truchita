    <text x="85" y="664" fill="#cfc2ae" font-size="16">Elote al carbón, salchicha, mayo, queso, limón y chile.</text>
    <rect x="72" y="700" width="915" height="68" fill="#e55426"/><text x="85" y="742" fill="#fff2d4" font-size="28">EL VORAZ · TODOS LOS INGREDIENTES CLÁSICOS</text><text x="970" y="742" fill="#1b1310" font-size="33" text-anchor="end">$115</text>
    <text x="85" y="813" fill="#f3e3c4" font-size="25">TOCINO + QUESO ESPECIAL</text><text x="970" y="813" fill="#f2bb2b" font-size="29" text-anchor="end">$95</text>
    <text x="85" y="844" fill="#cfc2ae" font-size="16">Mezcla de quesos, tocino, mayonesa, limón y chile.</text>
    <text x="85" y="895" fill="#f3e3c4" font-size="25">SALCHICHA + QUESO ESPECIAL</text><text x="970" y="895" fill="#f2bb2b" font-size="29" text-anchor="end">$95</text>
    <text x="85" y="926" fill="#cfc2ae" font-size="16">Mezcla de quesos, salchicha, mayonesa, limón y chile.</text>
